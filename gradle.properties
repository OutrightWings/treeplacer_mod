# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
#Two version numbers here as mod.json's are finicky
version=2.0.1
mod_version = 2.0.1
group=com.outrightwings
java_version=21

# Common
minecraft_version=1.21.10
mod_name=Treeplacer
mod_author=OutrightWings
mod_id=treeplacer
license=MIT
credits=
description=Dynamically change how saplings grow up with datapacks!
minecraft_version_range=[1.21.10, 1.22)

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.10-20251010.172816
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.9
parchment_version=2025.10.05

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.135.0+1.21.10
fabric_loader_version=0.17.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.10.8-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false